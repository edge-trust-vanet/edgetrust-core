[General]
network = EdgeTrustNetwork
sim-time-limit = 100s
repeat = 1

# Playground dimensions (must match or exceed SUMO network size)
*.playgroundSizeX = 200m
*.playgroundSizeY = 200m
*.playgroundSizeZ = 50m
*.annotations.draw = false
*.obstacles.obstacles = xmldoc("dummy_obstacles.xml")

# TraCI (SUMO) integration - relative to this folder
*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("edgetrust.launchd.xml")

# Assign our custom EdgeTrust applications to Veins modules
*.node[*].applType = "EdgeTrustVehicleApp"
*.rsu[*].applType = "EdgeTrustRSUApp"

# Vehicle Mobility dummy defaults (actual positions are given by SUMO via TraCI)
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

# RSU static positions (in meters) - intersection is roughly at (76, 41)
*.rsu[0].mobility.x = 76
*.rsu[0].mobility.y = 41
*.rsu[0].mobility.z = 3

*.rsu[1].mobility.x = 76
*.rsu[1].mobility.y = 80
*.rsu[1].mobility.z = 3

# IEEE 802.11p specific MAC/PHY settings
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false

*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps

*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")

*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m
*.**.nic.phy80211p.useThermalNoise = true
*.**.nic.phy80211p.thermalNoise = -110dBm

[Config Default]
description = "Default: VeReMi Mixed Heterogeneous Attacks (AdaBoost Active)"
*.node[*].appl.scenarioMode = "mixed"
*.rsu[*].appl.mlModel = "adaboost"

[Config Baseline_Honest]
description = "Scenario 1: Baseline - All Legitimate Vehicles (No Attacks)"
*.node[*].appl.scenarioMode = "baseline"
*.rsu[*].appl.mlModel = "adaboost"

[Config Scenario_FDI_PositionSpoof]
description = "Scenario 2: VeReMi FDI Position Offset Attack (Coordinates Spoofed)"
*.node[*].appl.scenarioMode = "fdi_position"
*.rsu[*].appl.mlModel = "adaboost"

[Config Scenario_FDI_SuddenStop]
description = "Scenario 3: VeReMi FDI Sudden Stop & Zero Speed Report (Ghost Accident)"
*.node[*].appl.scenarioMode = "fdi_suddenstop"
*.rsu[*].appl.mlModel = "adaboost"

[Config Scenario_DoS_Flooding]
description = "Scenario 4: VeReMi DoS Channel Flooding (High Frequency 16 Hz Burst)"
*.node[*].appl.scenarioMode = "dos"
*.rsu[*].appl.mlModel = "adaboost"

[Config Scenario_Sybil_Phantoms]
description = "Scenario 5: VeReMi Sybil Congestion & Phantom Identities"
*.node[*].appl.scenarioMode = "sybil"
*.rsu[*].appl.mlModel = "adaboost"

[Config Scenario_Blackhole_Drop]
description = "Scenario 6: Blackhole Selective Packet Dropping Attack (70% Drop)"
*.node[*].appl.scenarioMode = "blackhole"
*.rsu[*].appl.mlModel = "adaboost"

[Config Scenario_TimeDelay_Replay]
description = "Scenario 7: VeReMi Time Delay & Stale Message Replay Attack (+3s Latency)"
*.node[*].appl.scenarioMode = "timedelay"
*.rsu[*].appl.mlModel = "adaboost"

[Config Scenario_Mixed_AdaBoost]
description = "Scenario 8: VeReMi Mixed Heterogeneous Attacks (AdaBoost Active)"
*.node[*].appl.scenarioMode = "mixed"
*.rsu[*].appl.mlModel = "adaboost"

[Config Scenario_Mixed_RandomForest]
description = "Scenario 9: VeReMi Mixed Heterogeneous Attacks (Random Forest Active)"
*.node[*].appl.scenarioMode = "mixed"
*.rsu[*].appl.mlModel = "random_forest"

[Config RandomForest]
description = "Scenario: Random Forest Classifier Active (Mixed Mode)"
*.node[*].appl.scenarioMode = "mixed"
*.rsu[*].appl.mlModel = "random_forest"

