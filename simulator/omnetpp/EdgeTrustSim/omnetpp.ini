[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info

image-path = ../../images

network = RSUExampleScenario

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = true
print-undisposed = true

sim-time-limit = 200s

**.scalar-recording = true
**.vector-recording = true

*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m


##########################################################
# Annotation parameters                                  #
##########################################################
*.annotations.draw = true


##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("fourway.launchd.xml")
*.manager.trafficLightModuleType = "org.car2x.veins.nodes.TrafficLight"

*.tls[*].mobility.x = 0
*.tls[*].mobility.y = 0
*.tls[*].mobility.z = 3

*.tls[*].applType = "org.car2x.veins.modules.application.traci.TraCIDemoTrafficLightApp"
*.tls[*].logicType ="org.car2x.veins.modules.world.traci.trafficLight.logics.TraCITrafficLightSimpleLogic"


##########################################################
#                       RSU SETTINGS                     #
##########################################################
*.rsu[0].mobility.x = 58
*.rsu[0].mobility.y = 49
*.rsu[0].mobility.z = 3

*.rsu[*].applType = "org.car2x.veins.modules.application.edgetrust.EdgeTrustRSUApp"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.beaconInterval = 1s
*.rsu[*].appl.beaconUserPriority = 7
*.rsu[*].appl.dataUserPriority = 5
*.rsu[*].appl.mlModel = "random_forest"
*.rsu[*].appl.csvOutputPath = "results/live_extracted_features.csv"
*.rsu[*].appl.mlDataCsvPath = "../../../../../edgetrust-ml/data/live_extracted_features.csv"
*.rsu[*].appl.saveCheckpoint = true
*.rsu[*].appl.loadCheckpoint = false
*.rsu[*].appl.checkpointFile = "results/checkpoint_state.json"
*.rsu[*].appl.checkpointInterval = 20s
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m

##########################################################
#            11p specific parameters                     #
##########################################################
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 85m
*.connectionManager.drawMaxIntfDist = true

*.**.nic.mac1609_4.useServiceChannel = false

*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm

*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm

*.**.nic.phy80211p.decider = xmldoc("fourway-config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("fourway-config.xml")
*.**.nic.phy80211p.usePropagationDelay = true

*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m

##########################################################
#                      App Layer                         #
##########################################################
*.node[*].applType = "org.car2x.veins.modules.application.edgetrust.EdgeTrustVehicleApp"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = true
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s
*.node[*].appl.maliciousRatio = 0.25
*.rsu[*].appl.maxCommunicationRange = 85m
*.node[*].appl.maxCommunicationRange = 85m

##########################################################
#                      Mobility                          #
##########################################################
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = true
*.node[0].veinsmobility.accidentCount = 1
*.node[0].veinsmobility.accidentStart = 5s
*.node[0].veinsmobility.accidentDuration = 50s

# ── Primary Demo Configurations: Random Forest & LightGBM ─────
[Config Default]
description = "Default: VeReMi Mixed Fleet (Random Forest Active)"
*.node[*].appl.scenarioMode = "mixed"
*.rsu[*].appl.mlModel = "random_forest"

[Config LiveDemo_RandomForest]
description = "Live Demo: Random Forest Edge AI (VeReMi All Attacks)"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "random_forest"

[Config LiveDemo_LightGBM]
description = "Live Demo: LightGBM Edge AI (VeReMi All Attacks)"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "lightgbm"

[Config LiveDemo_FromCheckpoint]
description = "Live Demo: Resume from Calibrated Checkpoint (Random Forest, Pre-warmed Trust)"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "random_forest"
*.rsu[*].appl.loadCheckpoint = true
*.rsu[*].appl.checkpointFile = "results/checkpoint_state.json"

[Config Scenario_Checkpoint_WarmStart]
description = "Warm-Start: Load Dynamic Multi-Tier Trust State (Random Forest)"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "random_forest"
*.rsu[*].appl.loadCheckpoint = true
*.rsu[*].appl.checkpointFile = "results/checkpoint_state.json"

[Config Baseline_Honest]
description = "Baseline: All Legitimate Vehicles (No Attacks)"
*.node[*].appl.scenarioMode = "baseline"
*.rsu[*].appl.mlModel = "random_forest"

# ── Multi-Attack Benchmarks ───────────────────────────────────
[Config Scenario_VeReMi_MixAll_RandomForest]
description = "VeReMi mixAll: Complete 16-Attack Mix (Random Forest Active)"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "random_forest"

[Config Scenario_VeReMi_MixAll_LightGBM]
description = "VeReMi mixAll: Complete 16-Attack Mix (LightGBM Active)"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "lightgbm"

[Config Scenario_VeReMi_MixThree_RandomForest]
