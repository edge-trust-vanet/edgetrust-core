[General]
network = EdgeTrustNetwork
sim-time-limit = 100s
repeat = 1

# Playground dimensions (must match or exceed SUMO network size)
*.playgroundSizeX = 200m
*.playgroundSizeY = 200m
*.playgroundSizeZ = 50m
*.annotations.draw = false
*.obstacles.obstacles = xmldoc("dummy_obstacles.xml")

# TraCI (SUMO) integration - relative to this folder
*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("edgetrust.launchd.xml")

# Assign our custom EdgeTrust applications to Veins modules
*.node[*].applType = "EdgeTrustVehicleApp"
*.rsu[*].applType = "EdgeTrustRSUApp"

# Vehicle Mobility dummy defaults (actual positions are given by SUMO via TraCI)
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

# RSU static positions (in meters) - intersection is roughly at (76, 41)
*.rsu[0].mobility.x = 76
*.rsu[0].mobility.y = 41
*.rsu[0].mobility.z = 3

*.rsu[1].mobility.x = 76
*.rsu[1].mobility.y = 80
*.rsu[1].mobility.z = 3

# IEEE 802.11p specific MAC/PHY settings
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false

*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps

*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")

*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m
*.**.nic.phy80211p.useThermalNoise = true
*.**.nic.phy80211p.thermalNoise = -110dBm
