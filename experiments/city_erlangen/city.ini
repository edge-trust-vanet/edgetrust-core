[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info

image-path = ../../images

network = CityExampleScenario

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = true
print-undisposed = true

sim-time-limit = 600s

**.scalar-recording = true
**.vector-recording = true

*.playgroundSizeX = 2700m
*.playgroundSizeY = 3100m
*.playgroundSizeZ = 50m

##########################################################
# Annotation parameters                                  #
##########################################################
*.annotations.draw = true

##########################################################
# Obstacle parameters                                    #
##########################################################
*.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("erlangen_city.launchd.xml")
*.manager.trafficLightModuleType = "org.car2x.veins.nodes.TrafficLight"

*.tls[*].mobility.x = 0
*.tls[*].mobility.y = 0
*.tls[*].mobility.z = 3

*.tls[*].applType = "org.car2x.veins.modules.application.traci.TraCIDemoTrafficLightApp"
*.tls[*].logicType ="org.car2x.veins.modules.world.traci.trafficLight.logics.TraCITrafficLightSimpleLogic"

##########################################################
#                 CITY RSU INFRASTRUCTURE               #
##########################################################
# --- DISTRICT 0: East / University Campus & Research Park ---
*.rsu[0].mobility.x = 2418
*.rsu[0].mobility.y = 1578
*.rsu[0].mobility.z = 3
*.rsu[0].appl.rsuId = 0
*.rsu[0].appl.fogId = 0
*.rsu[0].appl.defaultPeerRsuId = 1
*.rsu[0].appl.checkpointFile = "results/checkpoint_city_rsu0.json"

*.rsu[1].mobility.x = 2439
*.rsu[1].mobility.y = 2139
*.rsu[1].mobility.z = 3
*.rsu[1].appl.rsuId = 1
*.rsu[1].appl.fogId = 0
*.rsu[1].appl.defaultPeerRsuId = 0
*.rsu[1].appl.checkpointFile = "results/checkpoint_city_rsu1.json"

# --- DISTRICT 1: Central / Downtown Core & Station ---
*.rsu[2].mobility.x = 1347
*.rsu[2].mobility.y = 1371
*.rsu[2].mobility.z = 3
*.rsu[2].appl.rsuId = 2
*.rsu[2].appl.fogId = 1
*.rsu[2].appl.defaultPeerRsuId = 3
*.rsu[2].appl.checkpointFile = "results/checkpoint_city_rsu2.json"

*.rsu[3].mobility.x = 1601
*.rsu[3].mobility.y = 703
*.rsu[3].mobility.z = 3
*.rsu[3].appl.rsuId = 3
*.rsu[3].appl.fogId = 1
*.rsu[3].appl.defaultPeerRsuId = 2
*.rsu[3].appl.checkpointFile = "results/checkpoint_city_rsu3.json"

# --- DISTRICT 2: West / Commercial Arterial & Ring ---
*.rsu[4].mobility.x = 204
*.rsu[4].mobility.y = 1430
*.rsu[4].mobility.z = 3
*.rsu[4].appl.rsuId = 4
*.rsu[4].appl.fogId = 2
*.rsu[4].appl.defaultPeerRsuId = 5
*.rsu[4].appl.checkpointFile = "results/checkpoint_city_rsu4.json"

*.rsu[5].mobility.x = 297
*.rsu[5].mobility.y = 2040
*.rsu[5].mobility.z = 3
*.rsu[5].appl.rsuId = 5
*.rsu[5].appl.fogId = 2
*.rsu[5].appl.defaultPeerRsuId = 4
*.rsu[5].appl.checkpointFile = "results/checkpoint_city_rsu5.json"

*.rsu[*].applType = "org.car2x.veins.modules.application.edgetrust.EdgeTrustRSUApp"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.beaconInterval = 1s
*.rsu[*].appl.beaconUserPriority = 7
*.rsu[*].appl.dataUserPriority = 5
*.rsu[*].appl.mlModel = "random_forest"
*.rsu[*].appl.csvOutputPath = "results/live_extracted_features.csv"
*.rsu[*].appl.mlDataCsvPath = "../../../../../edgetrust-ml/data/live_extracted_features.csv"
*.rsu[*].appl.maxCommunicationRange = 400m
*.rsu[*].appl.enableInterRSU = true
*.rsu[*].appl.interRsuSyncInterval = 2.0s
*.rsu[*].appl.enableFogIntegration = true
*.rsu[*].appl.enableSDN = true
*.rsu[*].appl.sdnPacketInterval = 2.0s
*.rsu[*].appl.saveCheckpoint = true
*.rsu[*].appl.loadCheckpoint = false
*.rsu[*].appl.checkpointInterval = 20s
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m

##########################################################
#              CITY REGIONAL FOG DISTRICTS               #
##########################################################
# Fog District 0: East / Campus Sector (RSUs 0..1)
*.fog[0].fogId = 0
*.fog[0].managedRsuOffset = 0
*.fog[0].managedRsuCount = 2
*.fog[0].peerFogId = 1
*.fog[0].checkpointFile = "results/checkpoint_city_fog0.json"
*.fog[0].posX = 2420
*.fog[0].posY = 1850
*.fog[0].posZ = 10

# Fog District 1: Central / Downtown Sector (RSUs 2..3)
*.fog[1].fogId = 1
*.fog[1].managedRsuOffset = 2
*.fog[1].managedRsuCount = 2
*.fog[1].peerFogId = 2
*.fog[1].checkpointFile = "results/checkpoint_city_fog1.json"
*.fog[1].posX = 1450
*.fog[1].posY = 1000
*.fog[1].posZ = 10

# Fog District 2: West / Commercial Sector (RSUs 4..5)
*.fog[2].fogId = 2
*.fog[2].managedRsuOffset = 4
*.fog[2].managedRsuCount = 2
*.fog[2].peerFogId = 0
*.fog[2].checkpointFile = "results/checkpoint_city_fog2.json"
*.fog[2].posX = 250
*.fog[2].posY = 1700
*.fog[2].posZ = 10

*.fog[*].fogSyncInterval = 2.0s
*.fog[*].conflictTolerance = 0.20
*.fog[*].saveCheckpoint = true
*.fog[*].loadCheckpoint = false
*.fog[*].checkpointInterval = 20s
*.fog[*].enableInterFog = true
*.fog[*].enableSDNIntegration = true

##########################################################
#            CITY SDN CONTROLLER PLANE                   #
##########################################################
*.sdn.numRSUs = 6
*.sdn.numFogs = 3
*.sdn.flowRuleTimeout = 10.0s
*.sdn.linkTrustThreshold = 0.60
*.sdn.controllerTickInterval = 1.0s
*.sdn.enableAdaptiveRerouting = true
*.sdn.enableQoSPriority = true
*.sdn.posX = 1350
*.sdn.posY = 300
*.sdn.posZ = 15

##########################################################
#            11p specific parameters                     #
##########################################################
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 500m
*.connectionManager.drawMaxIntfDist = false

*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m

##########################################################
#                      App Layer                         #
##########################################################
*.node[*].applType = "org.car2x.veins.modules.application.edgetrust.EdgeTrustVehicleApp"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = true
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s
*.node[*].appl.maliciousRatio = 0.25
*.node[*].appl.maxCommunicationRange = 400m

##########################################################
#                      Mobility                          #
##########################################################
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = true

# ── City Simulation Configurations ─────────────────────
[Config City_Full_Erlangen]
description = "Erlangen City-Wide: 6 RSUs across 3 Regional Fog Districts, Central SDN, VeReMi Attack Mix"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "random_forest"

[Config City_Honest_Baseline]
description = "Erlangen City-Wide: 100% Legitimate Transit Fleet (Honest Baseline)"
*.node[*].appl.scenarioMode = "baseline"
*.rsu[*].appl.mlModel = "random_forest"

[Config City_Adversarial_Storm]
description = "Erlangen City-Wide: 40% Malicious Vehicle Collusion Storm across all districts"
*.node[*].appl.scenarioMode = "mix_all"
*.node[*].appl.maliciousRatio = 0.40
*.rsu[*].appl.mlModel = "random_forest"

[Config City_SDN_Detour_Downtown_Reroute]
description = "Erlangen City-Wide: Downtown Backhaul Link (RSU1-RSU2) Severed at t=5s (SDN Detour Activated)"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "random_forest"
*.sdn.failLinkTime = 5s
*.sdn.failLinkSrc = 1
*.sdn.failLinkDst = 2
