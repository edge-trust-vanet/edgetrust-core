[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info

image-path = ../../images

network = HighwayScenario

##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = true
print-undisposed = true

sim-time-limit = 600s

**.scalar-recording = true
**.vector-recording = true

*.playgroundSizeX = 2100m
*.playgroundSizeY = 350m
*.playgroundSizeZ = 50m

##########################################################
# Annotation parameters                                  #
##########################################################
*.annotations.draw = true

##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("highway.launchd.xml")
*.manager.trafficLightModuleType = "org.car2x.veins.nodes.TrafficLight"

*.tls[*].mobility.x = 0
*.tls[*].mobility.y = 0
*.tls[*].mobility.z = 3

*.tls[*].applType = "org.car2x.veins.modules.application.traci.TraCIDemoTrafficLightApp"
*.tls[*].logicType ="org.car2x.veins.modules.world.traci.trafficLight.logics.TraCITrafficLightSimpleLogic"

##########################################################
#                       RSU SETTINGS                     #
##########################################################
# Highway West Sector (West Entry & Merge)
*.rsu[0].mobility.x = 300
*.rsu[0].mobility.y = 115
*.rsu[0].mobility.z = 3
*.rsu[0].appl.rsuId = 0
*.rsu[0].appl.fogId = 0
*.rsu[0].appl.defaultPeerRsuId = 1
*.rsu[0].appl.checkpointFile = "results/checkpoint_hwy_rsu0.json"

# Highway Westbound Mainline
*.rsu[1].mobility.x = 800
*.rsu[1].mobility.y = 115
*.rsu[1].mobility.z = 3
*.rsu[1].appl.rsuId = 1
*.rsu[1].appl.fogId = 0
*.rsu[1].appl.defaultPeerRsuId = 0
*.rsu[1].appl.checkpointFile = "results/checkpoint_hwy_rsu1.json"

# Highway Interchange Zone
*.rsu[2].mobility.x = 1300
*.rsu[2].mobility.y = 115
*.rsu[2].mobility.z = 3
*.rsu[2].appl.rsuId = 2
*.rsu[2].appl.fogId = 1
*.rsu[2].appl.defaultPeerRsuId = 3
*.rsu[2].appl.checkpointFile = "results/checkpoint_hwy_rsu2.json"

# Highway East Sector (Off-Ramp & Exit)
*.rsu[3].mobility.x = 1800
*.rsu[3].mobility.y = 115
*.rsu[3].mobility.z = 3
*.rsu[3].appl.rsuId = 3
*.rsu[3].appl.fogId = 1
*.rsu[3].appl.defaultPeerRsuId = 2
*.rsu[3].appl.checkpointFile = "results/checkpoint_hwy_rsu3.json"

*.rsu[*].applType = "org.car2x.veins.modules.application.edgetrust.EdgeTrustRSUApp"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.beaconInterval = 1s
*.rsu[*].appl.beaconUserPriority = 7
*.rsu[*].appl.dataUserPriority = 5
*.rsu[*].appl.mlModel = "random_forest"
*.rsu[*].appl.csvOutputPath = "results/live_extracted_features.csv"
*.rsu[*].appl.mlDataCsvPath = "../../../../../edgetrust-ml/data/live_extracted_features.csv"
*.rsu[*].appl.maxCommunicationRange = 350m
*.rsu[*].appl.enableInterRSU = true
*.rsu[*].appl.interRsuSyncInterval = 2.0s
*.rsu[*].appl.enableFogIntegration = true
*.rsu[*].appl.enableSDN = true
*.rsu[*].appl.sdnPacketInterval = 2.0s
*.rsu[*].appl.saveCheckpoint = true
*.rsu[*].appl.loadCheckpoint = false
*.rsu[*].appl.checkpointInterval = 20s
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m

##########################################################
#                  REGIONAL FOG SETTINGS                 #
##########################################################
# Fog Node 0 (West Highway Sector: RSUs 0..1)
*.fog[0].fogId = 0
*.fog[0].managedRsuOffset = 0
*.fog[0].managedRsuCount = 2
*.fog[0].peerFogId = 1
*.fog[0].checkpointFile = "results/checkpoint_hwy_fog0.json"
*.fog[0].posX = 550
*.fog[0].posY = 20
*.fog[0].posZ = 10

# Fog Node 1 (East Highway Sector: RSUs 2..3)
*.fog[1].fogId = 1
*.fog[1].managedRsuOffset = 2
*.fog[1].managedRsuCount = 2
*.fog[1].peerFogId = 0
*.fog[1].checkpointFile = "results/checkpoint_hwy_fog1.json"
*.fog[1].posX = 1550
*.fog[1].posY = 20
*.fog[1].posZ = 10

*.fog[*].fogSyncInterval = 2.0s
*.fog[*].conflictTolerance = 0.20
*.fog[*].saveCheckpoint = true
*.fog[*].loadCheckpoint = false
*.fog[*].checkpointInterval = 20s
*.fog[*].enableInterFog = true
*.fog[*].enableSDNIntegration = true

##########################################################
#            SDN CONTROLLER & ADAPTIVE FORWARDING        #
##########################################################
*.sdn.numRSUs = 4
*.sdn.numFogs = 2
*.sdn.flowRuleTimeout = 10.0s
*.sdn.linkTrustThreshold = 0.60
*.sdn.controllerTickInterval = 1.0s
*.sdn.enableAdaptiveRerouting = true
*.sdn.enableQoSPriority = true
*.sdn.posX = 1050
*.sdn.posY = 10
*.sdn.posZ = 15

##########################################################
#            11p specific parameters                     #
##########################################################
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 400m
*.connectionManager.drawMaxIntfDist = false

*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.decider = xmldoc("fourway-config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("fourway-config.xml")
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m

##########################################################
#                      App Layer                         #
##########################################################
*.node[*].applType = "org.car2x.veins.modules.application.edgetrust.EdgeTrustVehicleApp"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = true
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s
*.node[*].appl.maliciousRatio = 0.25
*.node[*].appl.maxCommunicationRange = 350m

##########################################################
#                      Mobility                          #
##########################################################
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = true

# ── Highway Configurations ─────────────────────────────
[Config Highway_Visual_Corridor]
description = "Highway: Multi-Lane Corridor with 4 RSUs, 2 Fogs, SDN, and VeReMi Mixed Attacks"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "random_forest"

[Config Highway_Honest_Baseline]
description = "Highway: Legitimate Vehicles Only (100% Honest Transit Baseline)"
*.node[*].appl.scenarioMode = "baseline"
*.rsu[*].appl.mlModel = "random_forest"

[Config Highway_Adversarial_Storm]
description = "Highway: Heavy 40% Malicious Penetration (High-Speed Position & Speed Attacks)"
*.node[*].appl.scenarioMode = "mix_all"
*.node[*].appl.maliciousRatio = 0.40
*.rsu[*].appl.mlModel = "random_forest"

[Config Highway_SDN_Detour]
description = "Highway: RSU1-RSU2 Inter-Sector Link Cut at t=5s (SDN Detour Activated)"
*.node[*].appl.scenarioMode = "mix_all"
*.rsu[*].appl.mlModel = "random_forest"
*.sdn.failLinkTime = 5s
*.sdn.failLinkSrc = 1
*.sdn.failLinkDst = 2
